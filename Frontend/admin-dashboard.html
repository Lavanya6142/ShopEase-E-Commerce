<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - ShopEase</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f5f5;
        color: #333;
    }

    .header {
        background: #222;
        color: white;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h2 {
        margin: 0;
    }

    .header a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
    }

    .dashboard {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .dashboard h1 {
        text-align: center;
        margin-bottom: 35px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .stat-card h2 {
        font-size: 32px;
        margin: 10px 0;
    }

    .stat-card p {
        margin: 0;
        color: #666;
    }

    .admin-actions {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .admin-actions a {
        text-decoration: none;
        padding: 14px 25px;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        background: #333;
        transition: 0.3s;
    }

    .admin-actions a:hover {
        background: #555;
        transform: translateY(-2px);
    }

    .footer {
        text-align: center;
        padding: 25px;
        margin-top: 50px;
        background: #222;
        color: white;
    }

    @media (max-width: 900px) {
        .stats {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .header {
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        .dashboard {
            margin-top: 25px;
        }
    }
</style>

</head>

<body>

```
<header class="header">

    <h2>ShopEase Admin</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-orders.html">Orders</a>
    </nav>

</header>


<main class="dashboard">

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <p>Total Products</p>
            <h2 id="totalProducts">0</h2>
        </div>

        <div class="stat-card">
            <p>Total Orders</p>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="stat-card">
            <p>Total Customers</p>
            <h2 id="totalCustomers">0</h2>
        </div>

        <div class="stat-card">
            <p>Total Sales</p>
            <h2 id="totalSales">₹0</h2>
        </div>

    </div>


    <div class="admin-actions">

        <a href="admin-products.html">
            Manage Products
        </a>

        <a href="admin-orders.html">
            Manage Orders
        </a>

        <a href="index.html">
            View Store
        </a>

    </div>

</main>


<footer class="footer">

    <p>© 2026 ShopEase. All Rights Reserved.</p>

</footer>


<script>

    async function loadDashboard() {

        try {

            // Load Products
            const productsResponse =
                await fetch(
                    "http://localhost:8080/products"
                );

            if (productsResponse.ok) {

                const products =
                    await productsResponse.json();

                document.getElementById(
                    "totalProducts"
                ).textContent =
                    products.length;
            }


            // Load Orders
            const ordersResponse =
                await fetch(
                    "http://localhost:8080/orders"
                );

            if (ordersResponse.ok) {

                const orders =
                    await ordersResponse.json();

                // Total Orders
                document.getElementById(
                    "totalOrders"
                ).textContent =
                    orders.length;


                // Count Unique Customers
                const customers =
                    new Set(
                        orders
                            .map(
                                order =>
                                    order.customerEmail
                            )
                            .filter(
                                email => email
                            )
                    );

                document.getElementById(
                    "totalCustomers"
                ).textContent =
                    customers.size;


                // Calculate Total Sales
                let totalSales = 0;

                orders.forEach(
                    function(order) {

                        totalSales +=
                            Number(
                                order.totalAmount
                            ) || 0;

                    }
                );


                document.getElementById(
                    "totalSales"
                ).textContent =
                    "₹" +
                    totalSales.toLocaleString(
                        "en-IN"
                    );
            }

        } catch (error) {

            console.error(
                "Dashboard Error:",
                error
            );

        }

    }


    loadDashboard();

</script>

</body>

</html>
