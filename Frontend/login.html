<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEase</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f1ea, #e8d8c3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .login-box h1 {
            text-align: center;
            color: #7a2e2e;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #7a2e2e;
            box-shadow: 0 0 5px rgba(122, 46, 46, 0.2);
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #7a2e2e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-box button:hover {
            background: #5f2222;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .login-box > p:last-child {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .login-box a {
            color: #7a2e2e;
            text-decoration: none;
            font-weight: bold;
        }

        .login-box a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }

            .login-box h1 {
                font-size: 28px;
            }

            .login-box h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ShopEase</h1>

            <h2>Login</h2>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit">Login</button>

            </form>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <a href="index.html">Go to Home</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
